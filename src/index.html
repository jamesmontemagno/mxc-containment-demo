<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense Calculator</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="calculator">
      <p class="eyebrow">EXPENSES</p>
      <h1>Expense Calculator</h1>
      <p class="intro">Estimate the total cost of an expense, including tax.</p>
      <form id="calculator-form">
        <label for="amount">Expense amount</label>
        <div class="input-wrap"><span>$</span><input id="amount" name="amount" type="number" min="0" step="0.01" value="100" required></div>
        <label for="tax-rate">Tax rate</label>
        <div class="input-wrap"><input id="tax-rate" name="taxRate" type="number" min="0" step="0.01" value="20" required><span>%</span></div>
        <button type="submit">Calculate total</button>
      </form>
      <section class="result" aria-live="polite">
        <span>Total including tax</span>
        <output id="total">$—</output>
      </section>
      <p id="error" role="alert"></p>
    </main>
  </body>
</html>
